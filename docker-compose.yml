# Local development database only. The app itself runs with ./mvnw spring-boot:run (docs/README.md).
# The credentials match the defaults in backend/src/main/resources/application-dev.yml.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flavors
      POSTGRES_USER: flavors
      POSTGRES_PASSWORD: flavors
    ports:
      - "5432:5432"
    volumes:
      - flavors-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flavors -d flavors"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flavors-db:
