flavors.proof-storage.type=filesystem
flavors.proof-storage.filesystem-root=${java.io.tmpdir}/flavors-test-proof-files

# Tests invoke these jobs explicitly so wall-clock scheduling cannot mutate another test's fixtures.
# Keep normal Maven/CI runs deterministic without relying on local command-line overrides.
flavors.escrow.release-deadline-cron=-
flavors.payout.processing-cron=-
