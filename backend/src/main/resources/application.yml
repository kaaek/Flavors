# Settings shared by every environment. Profile files (application-<profile>.yml)
# override these; pick one with SPRING_PROFILES_ACTIVE=dev|staging|prod.
spring:
  application:
    name: flavors

  # Built from the variables Railway's Postgres service exposes (PGHOST, PGPORT, ...),
  # so staging and production need no renaming. There are deliberately no defaults here:
  # a missing variable fails startup instead of silently connecting somewhere else.
  # Local defaults live in application-dev.yml.
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}

  jpa:
    # Flyway migrations own the schema. Hibernate only checks that the entities match
    # it at startup; it never creates or alters tables.
    hibernate:
      ddl-auto: validate
    # Off: keeping a DB connection open while the HTTP response renders hides
    # lazy-loading bugs and holds connections longer than needed.
    open-in-view: false
    properties:
      # Store and read timestamps in UTC no matter what the server's time zone is.
      hibernate.jdbc.time_zone: UTC

  flyway:
    locations: classpath:db/migration

  # Login sessions live in Postgres (Spring Session JDBC), so users stay logged in across
  # redeploys. Flyway's V1 creates the tables; Spring must not try to create them itself.
  session:
    jdbc:
      initialize-schema: never

server:
  # Railway tells the app which port to use through PORT.
  port: ${PORT:8080}
  # Railway terminates HTTPS at its proxy and forwards plain HTTP. This makes the app
  # trust the X-Forwarded-* headers, so it knows the original request was HTTPS
  # (needed later for Secure cookies and correct redirect URLs).
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # JavaScript can't read the session cookie, so an XSS bug can't steal the session.
        http-only: true
        # Sent over HTTPS only. Turned off in application-dev.yml for plain-HTTP localhost.
        secure: true
        # Not sent on requests started by other sites (forms, images), except top-level links.
        # Together with CSRF tokens, this blocks cross-site request forgery.
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        # Only /actuator/health is public; Railway and the CI smoke test poll it.
        include: health
  endpoint:
    health:
      show-details: never
