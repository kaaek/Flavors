# Local development. Defaults match docker-compose.yml; any PG* variable still overrides them.
spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:flavors}
    username: ${PGUSER:flavors}
    password: ${PGPASSWORD:flavors}

server:
  servlet:
    session:
      cookie:
        # Local development runs on plain http://localhost.
        secure: false
