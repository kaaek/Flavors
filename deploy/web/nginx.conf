# Serves the SPA; unknown paths fall back to index.html (replaces SpaForwardingConfig in the monolith).
# The API is never served here: the gateway / Ingress routes /api/** to the services.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
