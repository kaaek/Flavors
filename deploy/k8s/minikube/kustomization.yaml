# Minikube overlay: images come from Minikube's own Docker daemon (`eval $(minikube docker-env)`), small resource
# requests, ingress host flavors.local. Apply with: kubectl apply -k deploy/k8s/minikube
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

# Placeholder tags in the base become :dev, the tag the README builds into Minikube.
images:
  - name: flavors/identity
    newTag: dev
  - name: flavors/creator
    newTag: dev
  - name: flavors-brand
    newTag: dev
  - name: flavors/campaign
    newTag: dev
  - name: flavors/proof
    newTag: dev
  - name: flavors/payment
    newTag: dev
  - name: flavors/offer
    newTag: dev
  - name: flavors/notification
    newTag: dev
  - name: flavors/backend
    newTag: dev
  - name: flavors/web
    newTag: dev

patches:
  # Never pull: the images only exist inside Minikube's Docker.
  - target: { kind: Deployment }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  # Small footprint: the whole stack must fit in ~12 GB with every service switched on.
  - target: { kind: Deployment, labelSelector: "flavors.io/tier in (service,monolith)" }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 384Mi }
          limits: { memory: 768Mi }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=60" }
  - target: { kind: StatefulSet, labelSelector: "flavors.io/tier=database" }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { memory: 256Mi }
  - target: { kind: StatefulSet, name: rabbitmq }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 512Mi }
  # Local hostname. Add `$(minikube ip) flavors.local` to /etc/hosts (see README).
  - target: { kind: Ingress, name: flavors }
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: flavors.local
