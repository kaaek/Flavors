---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: flavors
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: monolith
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: flavors
        flavors.io/tier: monolith
    spec:
      containers:
        - name: backend
          image: flavors/backend:placeholder-build-from-root-Dockerfile
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: flavors-config
          env:
            - name: PGHOST
              value: monolith-db
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: monolith
            - name: PGUSER
              value: monolith
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: flavors-secrets, key: monolith-db-password }
            - name: FLAVORS_PROOF_STORAGE_PATH
              value: /tmp/proof-files
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: flavors
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: service
spec:
  # The monolith: default upstream for every route not yet moved.
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: monolith-db
  namespace: flavors
  labels:
    app.kubernetes.io/name: monolith-db
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: monolith-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monolith-db
  namespace: flavors
  labels:
    app.kubernetes.io/name: monolith-db
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: database
spec:
  serviceName: monolith-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monolith-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monolith-db
        app.kubernetes.io/part-of: flavors
        flavors.io/tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: monolith
            - name: POSTGRES_USER
              value: monolith
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flavors-secrets
                  key: monolith-db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "monolith", "-d", "monolith"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "monolith", "-d", "monolith"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
