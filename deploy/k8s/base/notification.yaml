---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: flavors
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: service
  annotations:
    flavors.io/placeholder: "true"   # image not built yet (Phase 1); replicas stay 0 until it is
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification
        app.kubernetes.io/part-of: flavors
        flavors.io/tier: service
    spec:
      containers:
        - name: notification
          image: flavors/notification:placeholder-not-built
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: flavors-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://notification-db:5432/notification
            - name: SPRING_DATASOURCE_USERNAME
              value: notification
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: flavors-secrets, key: notification-db-password }
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: { name: flavors-secrets, key: rabbitmq-username }
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: flavors-secrets, key: rabbitmq-password }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: flavors
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: service
spec:
  # STRANGLER: points at the monolith until notification ships. At cutover change this selector to `notification` and set replicas on the Deployment.
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: notification-db
  namespace: flavors
  labels:
    app.kubernetes.io/name: notification-db
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: notification-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notification-db
  namespace: flavors
  labels:
    app.kubernetes.io/name: notification-db
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: database
spec:
  serviceName: notification-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-db
        app.kubernetes.io/part-of: flavors
        flavors.io/tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: notification
            - name: POSTGRES_USER
              value: notification
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flavors-secrets
                  key: notification-db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "notification", "-d", "notification"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "notification", "-d", "notification"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
