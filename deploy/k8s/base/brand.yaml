---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brand
  namespace: flavors
  labels:
    app.kubernetes.io/name: brand
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: brand
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brand
        app.kubernetes.io/part-of: flavors
        flavors.io/tier: service
    spec:
      containers:
        - name: brand
          image: flavors-brand:dev
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: flavors-config
          env:
            # Phase 1 of the split: the brand service uses the SAME database as the monolith (it owns the
            # tables brand, branch and saved_creator; its Flyway is off, the monolith's migrations own the schema).
            # `brand-db` below is not used until the data-ownership phase.
            - name: PGHOST
              value: monolith-db
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: monolith
            - name: PGUSER
              value: monolith
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: flavors-secrets, key: monolith-db-password }
            # Identity's public keys (the platform library validates the access token against them).
            - name: FLAVORS_JWKS_URI
              value: http://identity:8080/.well-known/jwks.json
            # FLAVORS_JWT_ISSUER is left unset: the issuer is not checked until identity pins its `iss`.
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: brand
  namespace: flavors
  labels:
    app.kubernetes.io/name: brand
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: service
spec:
  # STRANGLER: brand has shipped (EEC-95 Phase 1b), so this Service now selects the brand pods.
  # To roll back, change the selector to `backend` (the monolith keeps no copy of these routes, so also revert the PR).
  selector:
    app.kubernetes.io/name: brand
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: brand-db
  namespace: flavors
  labels:
    app.kubernetes.io/name: brand-db
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: brand-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: brand-db
  namespace: flavors
  labels:
    app.kubernetes.io/name: brand-db
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: database
spec:
  serviceName: brand-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: brand-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brand-db
        app.kubernetes.io/part-of: flavors
        flavors.io/tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: brand
            - name: POSTGRES_USER
              value: brand
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flavors-secrets
                  key: brand-db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "brand", "-d", "brand"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "brand", "-d", "brand"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
