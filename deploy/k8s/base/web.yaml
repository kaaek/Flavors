---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: flavors
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: flavors
        flavors.io/tier: web
    spec:
      containers:
        - name: web
          image: flavors/web:placeholder-build-with-deploy-web-Dockerfile
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: flavors
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: flavors
    flavors.io/tier: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
