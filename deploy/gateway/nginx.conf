# Local gateway for the microservice stack (deploy/compose). The path table follows section 1.1 of the
# EEC-95 migration plan; deploy/k8s/base/ingress.yaml carries the same rules for Kubernetes.
#
# STRANGLER CUTOVER = changing the `set $up_<service>` lines below. Until a service exists, its routes go
# to the monolith (`backend`), which still serves every endpoint. When a service ships, point its line at
# `<service>:8080` (and enable its compose profile) and reload: `docker compose exec gateway nginx -s reload`.
#
# Upstreams are held in variables and resolved at request time through Docker's DNS, so nginx starts even
# when a service container is switched off. The first matching regex location wins, so the more specific
# routes come first.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Docker's embedded DNS; re-resolve every 10 s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Pass an existing X-Forwarded-Proto through (when something TLS-terminating sits in front), else use ours.
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Proof uploads: up to 5 images of 5 MiB each (multipart limit in backend application.yml is 27 MB).
    client_max_body_size 30m;
    server_tokens off;

    log_format gw '$remote_addr "$request" $status $upstream_addr rid=$request_id';
    access_log /dev/stdout gw;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name _;

        # ---- upstream table (the strangler switchboard) ----
    set $up_identity     "backend:8080";   # -> "identity:8080" once identity is deployed
    set $up_creator      "backend:8080";   # -> "creator:8080" once creator is deployed
    set $up_brand        "brand:8080";     # brand service (EEC-95 Phase 1b); start it with --profile brand
    set $up_campaign     "backend:8080";   # -> "campaign:8080" once campaign is deployed
    set $up_proof        "backend:8080";   # -> "proof:8080" once proof is deployed
    set $up_payment      "backend:8080";   # -> "payment:8080" once payment is deployed
    set $up_offer        "backend:8080";   # -> "offer:8080" once offer is deployed
    set $up_notification "backend:8080";   # -> "notification:8080" once notification is deployed
        set $up_web          "web:8080";         # the SPA; "backend:8080" also works (the jar embeds the SPA)
        set $up_default      "backend:8080";     # anything not matched below: the monolith

        location = /healthz { access_log off; return 200 "ok\n"; }

        # ---- routes (plan section 1.1) ----
        location ~ ^/api/brand/campaigns/[^/]+/proof/(reviews|[^/]+/review)(/|$) {  # proof review decisions belong to campaign
            set $upstream $up_campaign;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/brand/campaigns/[^/]+/proof(/|$) {  # evidence
            set $upstream $up_proof;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/creator/campaigns/[^/]+/proof(/|$) {  # evidence
            set $upstream $up_proof;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/admin/campaigns/[^/]+/proof(/|$) {  # evidence
            set $upstream $up_proof;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/proof-files(/|$) {  # evidence files
            set $upstream $up_proof;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/brand/campaigns/[^/]+/payment(/|$) {  # pay
            set $upstream $up_payment;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/[^/]+/campaigns/[^/]+/escrow(/|$) {  # escrow state (brand, creator, admin)
            set $upstream $up_payment;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/public/payments(/|$) {  # provider callback / return
            set $upstream $up_payment;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/admin/payouts(/|$) {  # payout approval
            set $upstream $up_payment;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/brand/campaigns/[^/]+/offer(/|$) {
            set $upstream $up_offer;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/public/offers(/|$) {
            set $upstream $up_offer;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/public/claims(/|$) {
            set $upstream $up_offer;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/brand/redemptions(/|$) {  # scan
            set $upstream $up_offer;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/brand/campaigns(/|$) {
            set $upstream $up_campaign;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/creator/campaigns(/|$) {
            set $upstream $up_campaign;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/me(/|$) {
            set $upstream $up_identity;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/public/auth/(login|password-reset|mfa)(/|$) {
            set $upstream $up_identity;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/auth/logout(/|$) {
            set $upstream $up_identity;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/admin/users(/|$) {  # EEC-56
            set $upstream $up_identity;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/public/auth/register/creator(/|$) {
            set $upstream $up_creator;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/creator/(status|portfolio|social)(/|$) {
            set $upstream $up_creator;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/brand/creators(/|$) {  # search, facets, portfolio view
            set $upstream $up_creator;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/admin/creators(/|$) {  # approvals
            set $upstream $up_creator;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/public/storefront(/|$) {  # EEC-48
            set $upstream $up_creator;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/public/auth/register/brand(/|$) {  # stays in the monolith until identity's POST /internal/users exists
            set $upstream $up_default;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/brand/(profile|branches|saved-creators)(/|$) {
            set $upstream $up_brand;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/creator/brands/search(/|$) {
            set $upstream $up_brand;
            include /etc/nginx/flavors-proxy.conf;
        }
        location ~ ^/api/notifications(/|$) {
            set $upstream $up_notification;
            include /etc/nginx/flavors-proxy.conf;
        }

        # SPA and everything else not yet moved.
        location ~ ^/(api|actuator|v3|swagger-ui)(/|$) {
            set $upstream $up_default;
            include /etc/nginx/flavors-proxy.conf;
        }
        location / {
            set $upstream $up_web;
            include /etc/nginx/flavors-proxy.conf;
        }
    }
}
