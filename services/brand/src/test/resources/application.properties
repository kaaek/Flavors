# Tests build the monolith's schema (the database the brand service shares in Phase 1) with the monolith's own
# migrations. The service itself never runs Flyway (application.yml). Surefire/Failsafe run in services/brand.
spring.flyway.enabled=true
spring.flyway.locations=filesystem:../../backend/src/main/resources/db/migration

# Never contacted: the decoder fetches keys lazily, and these tests sign nobody in with a real token.
flavors.platform.security.jwks-uri=http://localhost:1/.well-known/jwks.json
